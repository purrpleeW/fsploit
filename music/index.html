<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music | purrplee</title>
    <meta name="description" content="What's constantly playing in purrplee's headphones.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💜</text></svg>">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="music-page">

<div class="floating-glow"></div>

<div id="preloader">
    <div class="loader-content">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>
</div>

<header class="site-header">
    <div class="logo">fsploit<span>.xyz</span></div>
    <nav class="nav-container">
        <a href="/">Home</a>
        <a href="/bio/">Bio</a>
        <a href="/friends/">Friends</a>
        <a href="/music/" class="active">Music</a>
    </nav>
</header>

<main>

    <section class="hero small-hero fade-in">
        <h1 class="hero-title">Music 🎶</h1>
        <p class="hero-sub">what's constantly playing in my headphones</p>
    </section>

    <section class="section">
        <h2>Music Player</h2>
            <div class="custom-music-player fade-up">
                <div class="player-visuals">
                    <img id="cover-art" src="../images/default.jpg" alt="Album Cover">
                </div>
                
                <div class="player-controls-container">
                    <div class="track-info">
                        <h3 id="track-title">Loading...</h3>
                        <p id="track-artist">Loading...</p>
                    </div>
                    
                    <div class="progress-area">
                        <span id="current-time">0:00</span>
                        <input type="range" id="progress-bar" value="0" max="100" aria-label="Seek progress">
                        <span id="total-time">0:00</span>
                    </div>

                    <div class="bottom-controls">
                        <div class="controls">
                            <button id="prev-track" aria-label="Previous Track"><i class="fa-solid fa-backward-step"></i></button>
                            <button id="play-pause" class="play-btn" aria-label="Play or Pause"><i class="fa-solid fa-play"></i></button>
                            <button id="next-track" aria-label="Next Track"><i class="fa-solid fa-forward-step"></i></button>
                        </div>
                        
                        <div class="volume-control">
                            <button id="mute-btn" aria-label="Toggle Mute"><i class="fa-solid fa-volume-high"></i></button>
                            <input type="range" id="volume-slider" value="50" max="100" aria-label="Volume slider">
                        </div>
                    </div>
                </div>
                
                <audio id="audio-player" src=""></audio>
            </div>
    </section>

    <section class="section">
            <h2>My Playlist</h2>
            <div class="custom-playlist-container fade-up">
                <ul id="playlist-ui" class="playlist-list">
                    <!--js shit here-->
                </ul>
            </div>
    </section>
</main>

<button id="rain-toggle" class="rain-btn" aria-label="Toggle ambient rain">🌧</button>

<footer>
    <p>much love, purrplee 💜</p>
</footer>

<script src="../javascript/main.js"></script>

</body>
</html>
